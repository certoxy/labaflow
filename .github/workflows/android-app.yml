name: Build Android pilot

on:
  push:
    branches:
      - develop
    paths:
      - "mobile/**"
      - "lib/printerSettings.ts"
      - "app/organization/printer/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: App environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install mobile dependencies
        run: npm ci
      - name: Select LabaFlow environment
        run: |
          if [ "${{ inputs.environment || 'staging' }}" = "production" ]; then
            echo "LABAFLOW_APP_URL=https://labaflow.paotechs.com" >> "$GITHUB_ENV"
          else
            echo "LABAFLOW_APP_URL=https://staging.labaflow.paotechs.com" >> "$GITHUB_ENV"
          fi
      - name: Generate and synchronize Android project
        run: npm run android:add && npm run android:sync
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: labaflow-${{ inputs.environment }}-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
