name: Build Android pilot

permissions:
  contents: write

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "mobile/**"
      - "lib/printerSettings.ts"
      - "app/organization/printer/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: App environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install mobile dependencies
        run: npm ci
      - name: Select LabaFlow environment
        id: app_environment
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ inputs.environment || 'staging' }}" = "production" ]; then
            echo "LABAFLOW_APP_URL=https://labaflow.paotechs.com" >> "$GITHUB_ENV"
            echo "LABAFLOW_VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "LABAFLOW_APP_URL=https://staging.labaflow.paotechs.com" >> "$GITHUB_ENV"
            echo "LABAFLOW_VERSION_NAME=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "production=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate and synchronize Android project
        run: npm run android:add && npm run android:sync
      - name: Apply LabaFlow and PAO Technologies launcher icon
        run: cp -R resources/android/. android/app/src/main/res/
      - name: Set Android build version
        run: |
          sed -i "s/versionCode [0-9][0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${LABAFLOW_VERSION_NAME}\"/" android/app/build.gradle
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: labaflow-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Configure Play Store signing
        if: steps.app_environment.outputs.production == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/labaflow-upload-key.jks"
          printf '\napply from: "../../play-signing.gradle"\n' >> android/app/build.gradle
      - name: Build signed Play Store bundle
        if: steps.app_environment.outputs.production == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/labaflow-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        if: steps.app_environment.outputs.production == 'true'
        with:
          name: labaflow-play-store-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish staging APK download
        if: (github.event_name == 'push' && github.ref_name == 'develop') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LabaFlow-Staging-Android.apk
          gh release view android-staging >/dev/null 2>&1 || gh release create android-staging --target develop --prerelease --title "LabaFlow Android Staging" --notes "Installable Android pilot connected to LabaFlow Staging."
          gh release upload android-staging LabaFlow-Staging-Android.apk --clobber
      - name: Publish production APK download
        if: (github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk LabaFlow-Android.apk
          gh release view android-production >/dev/null 2>&1 || gh release create android-production --target main --prerelease --title "LabaFlow Android" --notes "Installable Android app connected to live LabaFlow."
          gh release upload android-production LabaFlow-Android.apk --clobber
      - name: Publish Play Store bundle
        if: steps.app_environment.outputs.production == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab LabaFlow-Play-Internal.aab
          gh release view android-play-internal >/dev/null 2>&1 || gh release create android-play-internal --target main --prerelease --title "LabaFlow Google Play Internal" --notes "Signed Android App Bundle for Google Play internal testing."
          gh release upload android-play-internal LabaFlow-Play-Internal.aab --clobber
